name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test for a release.
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 3.15 is tracked before it is supported: until its final release, and
    # until numpy, lxml and the docs toolchain ship wheels for it, it may fail
    # without failing the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Install TeX and VecTeX for the pendulum's equations
        # dvisvgm is its own package, which texlive-binaries only recommends,
        # so with --no-install-recommends it has to be named.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-binaries dvisvgm
          uv pip install vectex
      - run: uv run python examples/slab_polarizer.py
      - run: uv run python examples
      - run: uv run zensical build
