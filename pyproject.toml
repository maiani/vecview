[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vecview"
version = "0.3.0"
description = "Layered 3D scenes that render to SVG, for scientific schematics"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andrea Maiani", email = "dev@andreamaiani.com" }]
license = "MIT"
keywords = ["svg", "3d", "vector-graphics", "figures", "axonometric"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = ["contourpy>=1.2", "numpy>=1.24", "shapely>=2.0", "svg.py>=1.4"]

[project.urls]
Source = "https://github.com/maiani/vecview"
Issues = "https://github.com/maiani/vecview/issues"

[project.optional-dependencies]
examples = ["cairosvg>=2.7"]

[dependency-groups]
dev = [
  "build>=1.2",
  "ty>=0.0.84",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "zensical>=0.0.57,<0.1",
  "cairosvg>=2.7",
]

[tool.hatch.build.targets.wheel]
# Keep release metadata compatible with publishing tools that do not yet accept 2.5.
core-metadata-version = "2.4"
packages = ["src/vecview"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/AGENTS.md",
  "/pyproject.toml",
  "/zensical.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep library signatures annotated; ty checks their types.
extend-select = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# S314: tests parse SVG this package just generated, not untrusted input.
"tests/**" = ["ANN", "S101", "S314"]
"examples/**" = ["ANN", "S101"]

[tool.ty.src]
include = ["src"]

[tool.coverage.run]
branch = true
source = ["vecview"]

[tool.coverage.report]
show_missing = true
skip_covered = true
